# Builds a debug APK on every push and uploads it as a workflow artifact, so the
# APK can be downloaded from the Actions tab without a local Android Studio
# install. A signed release build runs on version tags (v*) when the keystore
# secrets below are configured.
#
# NOTE: paths assume this directory (pivot-launcher/) is the repository root.
# If the launcher lives in a subdirectory of a larger repo, move this file to
# <repo-root>/.github/workflows/ and add `working-directory: pivot-launcher`
# (plus the pivot-launcher/ prefix on artifact paths).
#
# Release signing setup (one time):
#   1. Create a keystore locally:
#        keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 \
#          -validity 10000 -alias pivot-launcher
#   2. Base64-encode it:  base64 -i release.jks | pbcopy   (macOS)
#                         base64 -w0 release.jks           (Linux)
#   3. In the GitHub repo: Settings -> Secrets and variables -> Actions, add:
#        RELEASE_KEYSTORE_BASE64    (the base64 string)
#        RELEASE_KEYSTORE_PASSWORD
#        RELEASE_KEY_ALIAS          (e.g. pivot-launcher)
#        RELEASE_KEY_PASSWORD
#   4. Push a tag like v1.0 to produce the signed APK artifact.

name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pivot-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pivot-launcher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
